name: Celo tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: celo-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Celo EVM and DeBank trace tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 3
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: false
      - uses: dtolnay/rust-toolchain@1.94
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
      - name: Run existing Celo execution and trace regressions
        run: cargo test --locked -p celo-revm -p alloy-celo-evm -p celo-reth --lib
